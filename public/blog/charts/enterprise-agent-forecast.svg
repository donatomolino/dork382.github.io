<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">AI agentica nel software aziendale</title><desc id="chart-desc">Gartner 2025: meno dell'1% di applicazioni aziendali con AI agentica nel 2024; previsione del 33% nel 2028.</desc>
<rect x="0" y="0" width="1000" height="480" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#11110f" >AI agentica nel software aziendale</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Quota di applicazioni enterprise con AI agentica, Gartner 2025</text><text x="48" y="211" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#11110f" >2024</text><rect x="245" y="175" width="600" height="45" fill="#dfded9" rx="3" /><rect x="245" y="175" width="15" height="45" fill="#11110f" rx="2" stroke="#11110f" stroke-dasharray="5 5"/><text x="275" y="205" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#11110f" >&lt;1%</text><text x="48" y="304" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#11110f" >2028</text><rect x="245" y="268" width="600" height="45" fill="#dfded9" rx="3" /><rect x="245" y="268" width="495" height="45" fill="#ed1c24" rx="3" /><text x="750" y="298" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#11110f" >33%</text><text x="48" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#5b5a56" >2024: meno dell’1%  •  2028: previsione, non dato osservato</text><line x1="48" y1="411" x2="952" y2="411" stroke="#11110f" stroke-width="2"/><text x="48" y="437" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Fonte: Gartner, comunicato del 25 giugno 2025</text><text x="48" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Scala fino al 40%; il valore 2024 indica un limite superiore dell’1%.</text>
</svg>
