<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Spesa SaaS aziendale esposta entro il 2030</title><desc id="chart-desc">Stima Gartner luglio 2026: fino a 234 miliardi di dollari, circa il 20% della spesa SaaS applicativa aziendale, esposta entro il 2030; non sono ricavi persi.</desc>
<rect x="0" y="0" width="1000" height="500" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#11110f" >Una sfida da 234 miliardi di dollari</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Spesa SaaS applicativa potenzialmente esposta entro il 2030, Gartner</text><text x="48" y="220" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" fill="#11110f" >Fino a $234 mld</text><text x="48" y="270" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#11110f" >~20% della spesa SaaS applicativa aziendale</text><rect x="48" y="308" width="904" height="66" fill="#dfded9" rx="3" /><rect x="48" y="308" width="181" height="66" fill="#ed1c24" rx="3" /><text x="68" y="350" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f2f1ed" >~20%</text><text x="248" y="350" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#11110f" >~80% restante (complemento illustrativo)</text><line x1="48" y1="431" x2="952" y2="431" stroke="#11110f" stroke-width="2"/><text x="48" y="457" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Fonte: Gartner, 1 luglio 2026</text><text x="48" y="481" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Esposizione stimata alla pressione di mercato, NON ricavi già persi.</text>
</svg>
