<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Tappe dell’interoperabilità dal 2018 al 2026</title><desc id="chart-desc">Cronologia: ActivityPub 2018, Data Act settembre 2025, interoperabilità WhatsApp novembre 2025, MCP nella Agentic AI Foundation dicembre 2025, disponibilità dei wallet UE prevista entro fine 2026.</desc>
<rect x="0" y="0" width="1000" height="685" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="800" fill="#11110f" >L’interoperabilità si sta costruendo</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Tappe di standard e normative • le scadenze sono indicate</text><line x1="145" y1="153" x2="145" y2="544" stroke="#dfded9" stroke-width="5"/><circle cx="145" cy="165" r="10" fill="#11110f"/><text x="50" y="171" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" text-anchor="start">2018</text><text x="190" y="165" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >ActivityPub</text><text x="190" y="194" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Raccomandazione W3C per i social decentralizzati</text>
<circle cx="145" cy="256" r="10" fill="#2149d8"/><text x="50" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#2149d8" text-anchor="start">SET 2025</text><text x="190" y="256" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >EU Data Act</text><text x="190" y="285" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Norme su condivisione dati e cambio cloud</text>
<circle cx="145" cy="347" r="10" fill="#ed1c24"/><text x="50" y="353" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#ed1c24" text-anchor="start">NOV 2025</text><text x="190" y="347" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >Interoperabilità WhatsApp</text><text x="190" y="376" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Primi servizi terzi di messaggistica collegati</text>
<circle cx="145" cy="438" r="10" fill="#2149d8"/><text x="50" y="444" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#2149d8" text-anchor="start">DIC 2025</text><text x="190" y="438" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >MCP / Agentic AI Foundation</text><text x="190" y="467" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Protocollo aperto nell’ecosistema Linux Foundation</text>
<circle cx="145" cy="529" r="10" fill="#11110f"/><text x="50" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" text-anchor="start">FINE 2026</text><text x="190" y="529" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >Wallet europei di identità digitale</text><text x="190" y="558" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Scadenza di disponibilità, non adozione universale</text><line x1="48" y1="616" x2="952" y2="616" stroke="#11110f" stroke-width="2"/><text x="48" y="642" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Fonti: W3C, Commissione UE (DMA/Data Act/Wallet), Linux Foundation</text><text x="48" y="666" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Meccanismi diversi: nessuno rende tutte le piattaforme interoperabili.</text>
</svg>
