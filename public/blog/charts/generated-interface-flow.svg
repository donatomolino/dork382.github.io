<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Dalla richiesta a un’interfaccia con permessi</title><desc id="chart-desc">Schema concettuale: confronto bollette, accesso autorizzato ai dati, grafico e azioni approvate, conferma umana per le modifiche sensibili.</desc>
<rect x="0" y="0" width="1000" height="630" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800" fill="#11110f" >Un’interfaccia per ogni compito</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Schema illustrativo: interfaccia AI con permessi e conferme</text><rect x="48" y="152" width="904" height="72" fill="#e6e5e1" rx="4" /><rect x="48" y="152" width="9" height="72" fill="#11110f"  /><text x="71" y="198" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#11110f" >01</text><text x="148" y="180" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" >RICHIESTA</text><text x="148" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#11110f" >«Confronta le mie bollette.»</text><text x="495" y="243" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#ed1c24" text-anchor="middle">↓</text>
<rect x="48" y="247" width="904" height="72" fill="#e6e5e1" rx="4" /><rect x="48" y="247" width="9" height="72" fill="#2149d8"  /><text x="71" y="293" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#2149d8" >02</text><text x="148" y="275" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" >DATI AUTORIZZATI</text><text x="148" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#11110f" >Bollette, consumi e tariffe</text><text x="495" y="338" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#ed1c24" text-anchor="middle">↓</text>
<rect x="48" y="342" width="904" height="72" fill="#e6e5e1" rx="4" /><rect x="48" y="342" width="9" height="72" fill="#2149d8"  /><text x="71" y="388" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#2149d8" >03</text><text x="148" y="370" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" >COMPONENTI APPROVATI</text><text x="148" y="399" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#11110f" >Grafico, tabella comparativa e azioni</text><text x="495" y="433" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#ed1c24" text-anchor="middle">↓</text>
<rect x="48" y="437" width="904" height="72" fill="#e9d6d3" rx="4" /><rect x="48" y="437" width="9" height="72" fill="#ed1c24"  /><text x="71" y="483" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#ed1c24" >04</text><text x="148" y="465" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" >DECISIONE UMANA</text><text x="148" y="494" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#11110f" >Conferma prima di pagamenti o cambio contratto</text><line x1="48" y1="561" x2="952" y2="561" stroke="#11110f" stroke-width="2"/><text x="48" y="587" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Schema concettuale: Donato Molino • Google Research e A2UI</text><text x="48" y="611" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >È uno schema di prodotto ipotetico, non una misura di affidabilità.</text>
