<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">AI agents at work: where are organizations?</title><desc id="chart-desc">McKinsey Global Survey 2025. 23 percent report scaling AI agents; an additional 39 percent report experimenting. Percentages describe survey respondents, not all businesses.</desc>
<rect x="0" y="0" width="1000" height="490" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#11110f" >AI agents: where are organizations?</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Share of survey respondents reporting use at their organization</text><text x="48" y="197" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#11110f" >Scaling</text><rect x="280" y="170" width="540" height="46" fill="#dfded9" rx="4" /><rect x="280" y="170" width="124.2" height="46" fill="#2149d8" rx="4" /><text x="835" y="200" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#11110f" >23%</text>
<text x="48" y="295" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#11110f" >Experimenting</text><rect x="280" y="268" width="540" height="46" fill="#dfded9" rx="4" /><rect x="280" y="268" width="210.6" height="46" fill="#ed1c24" rx="4" /><text x="835" y="298" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#11110f" >39%</text><text x="280" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#5b5a56" >0</text><text x="550" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#5b5a56" >50%</text><text x="820" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#5b5a56" >100%</text><line x1="280" y1="359" x2="820" y2="359" stroke="#11110f" stroke-width="1"/><line x1="48" y1="421" x2="952" y2="421" stroke="#11110f" stroke-width="2"/><text x="48" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Source: McKinsey, State of AI 2025 (n=1,993 respondents)</text><text x="48" y="471" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Scaling and experimenting are distinct reported groups; not a personal-AI adoption rate.</text>
</svg>
