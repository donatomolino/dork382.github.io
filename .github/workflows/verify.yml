name: Verify Website Build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test comments API using local SQLite
        run: node --test workers/comments/index.test.mjs
      - name: Build production site
        run: npm run build
      - name: Check generated discovery files
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/llms.txt
          test -f dist/blog/rss.xml
          test -f dist/blog/it/index.html
          test -f dist/blog/en/index.html
          test -f dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          test -f dist/blog/en/the-future-of-tech-2027-2050/index.html
          test -f dist/blog/og/it/il-futuro-del-tech-2027-2050.png
          test -f dist/blog/og/en/the-future-of-tech-2027-2050.png
          grep -q 'OAI-SearchBot' dist/robots.txt
          grep -q 'https://donatomolino.it/blog/en/' dist/sitemap.xml
          grep -q 'https://donatomolino.it/blog/it/' dist/sitemap.xml
          grep -q '"@type":"BlogPosting"' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q 'hreflang="it"' dist/blog/en/the-future-of-tech-2027-2050/index.html
          # Home design elements are rendered by Astro and must not depend on JS.
          grep -q 'class="hero-squircle"' dist/index.html
          grep -q 'class="journal-section"' dist/index.html
          grep -q 'href="/blog/en/the-future-of-tech-2027-2050/"' dist/index.html
          # No animated first-visit gate; contact options are SSR HTML and JS-free.
          ! grep -q 'dm-intro-overlay' dist/index.html
          grep -q 'class="contact-disclosure"' dist/index.html
          grep -q '01 / Email' dist/index.html
          grep -q '02 / Telegram' dist/index.html
          grep -q '03 / Discord' dist/index.html
          grep -q 'donatomolino@proton.me' dist/index.html
          grep -q 'Add friend on Discord' dist/index.html
          # Approved SVG mark exists as a small favicon and in all shared headers.
          test -f dist/favicon.svg
          grep -q 'viewBox="200 200 850 850"' dist/favicon.svg
          grep -q 'site-brand-mark' dist/index.html
          grep -q 'site-brand-mark' dist/blog/en/index.html
          grep -q 'site-brand-mark' dist/blog/it/index.html
          grep -q 'site-brand-mark' dist/manifesto/index.html
          # SwooshMania is the only featured product and has grounded progress labels.
          grep -q 'id="swooshmania-title"' dist/index.html
          grep -q 'Unique demo players' dist/index.html
          grep -q 'Steam wishlists' dist/index.html
          grep -q 'Planned release' dist/index.html
          grep -q '2027' dist/index.html
          grep -q 'September 2026' dist/index.html
          ! grep -q 'FarmingCat' dist/index.html
          ! grep -q 'Post Office' dist/index.html
          ! grep -q '06 projects' dist/index.html
          ! grep -q 'donatomolino@europe.com' dist/index.html

          grep -q 'data-thread="future-tech"' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q 'data-thread="future-tech"' dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          # Eight referenced charts must be valid static assets, not JS widgets.
          for name in enterprise-agents-survey agents-osworld enterprise-agent-forecast saas-exposure-2030 interoperability-milestones generated-interface-flow iot-devices smart-glasses; do
            test -f "dist/blog/charts/en/$name.svg"
            grep -q "/blog/charts/en/$name.svg" dist/blog/en/the-future-of-tech-2027-2050/index.html
            test -f "dist/blog/charts/$name.svg"
            grep -q "/blog/charts/$name.svg" dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          done
          grep -q '2026-11-24' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q '2026-11-24' dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          for article in dist/blog/en/the-future-of-tech-2027-2050/index.html dist/blog/it/il-futuro-del-tech-2027-2050/index.html; do
            for product in 'ChatGPT' 'Claude Code' 'Model Context Protocol' 'Ray-Ban Meta' 'Meta Ray-Ban Display' 'Meta Orion' 'Samsung DeX' 'Apple Vision Pro' 'Home Assistant' 'GitHub Copilot'; do
              grep -q "$product" "$article"
            done
          done
          grep -q 'A new market: tools for AI' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q 'Un nuovo mercato: strumenti per le AI' dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          for chart in dist/blog/charts/en/enterprise-agent-forecast.svg dist/blog/charts/enterprise-agent-forecast.svg; do
            for year in 2024 2025 2026 2027 2028; do
              grep -q ">$year<" "$chart"
            done
          done
          grep -q 'N/A' dist/blog/charts/en/enterprise-agent-forecast.svg
          grep -q 'n.d.' dist/blog/charts/enterprise-agent-forecast.svg
          grep -q 'Chart 8' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q 'Sources and methodology' dist/blog/en/the-future-of-tech-2027-2050/index.html

          # AI discovery: important blog links are direct and summaries are real SSR text.
          grep -q 'href="/blog/en/"' dist/index.html
          ! grep -q 'href="/blog/"' dist/index.html
          grep -q 'The argument in a nutshell' dist/blog/en/the-future-of-tech-2027-2050/index.html
          grep -q 'La mia idea, in sintesi' dist/blog/it/il-futuro-del-tech-2027-2050/index.html
          grep -q 'forecast' dist/llms.txt
          # All public article routes remain represented in the sitemap.
          grep -q 'https://donatomolino.it/blog/en/the-future-of-tech-2027-2050/' dist/sitemap.xml
          grep -q 'https://donatomolino.it/blog/it/il-futuro-del-tech-2027-2050/' dist/sitemap.xml

          grep -q 'Up to $234B' dist/blog/charts/en/saas-exposure-2030.svg
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for chart in Path('dist/blog/charts').rglob('*.svg'):
              ET.parse(chart)
          print('All editorial SVG charts parse as XML')
          PY

