<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Enterprise SaaS spending exposed by 2030</title><desc id="chart-desc">Gartner's July 2026 forecast: up to 234 billion US dollars, roughly 20 percent of enterprise application SaaS spending, could be exposed to agentic arbitrage by 2030. Exposure does not mean spending lost.</desc>
<rect x="0" y="0" width="1000" height="500" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#11110f" >A $234B challenge for software vendors</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Potential enterprise application SaaS spending exposed by 2030, Gartner</text><text x="48" y="220" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" fill="#11110f" >Up to $234B</text><text x="48" y="270" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#11110f" >~20% of enterprise application SaaS spend</text><rect x="48" y="308" width="904" height="66" fill="#dfded9" rx="3" /><rect x="48" y="308" width="181" height="66" fill="#ed1c24" rx="3" /><text x="68" y="350" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f2f1ed" >~20%</text><text x="248" y="350" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#11110f" >Remaining ~80%  (illustrative complement)</text><line x1="48" y1="431" x2="952" y2="431" stroke="#11110f" stroke-width="2"/><text x="48" y="457" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Source: Gartner, 1 July 2026</text><text x="48" y="481" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Exposure is analyst-estimated market pressure — NOT revenue already lost.</text>
</svg>
