<title id="chart-title">AI agentica nel software aziendale</title><desc id="chart-desc">Due indicatori distinti Gartner: AI agentica, meno dell’1% nel 2024 e 33% previsto nel 2028; agenti specifici, meno del 5% nel 2025 e fino al 40% previsto per fine 2026. Dati intermedi non disponibili. Per il 2027, previsione separata di un terzo delle implementazioni con agenti di competenze diverse.</desc>
