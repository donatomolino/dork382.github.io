<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Interoperability milestones from 2018 to 2026</title><desc id="chart-desc">A source-backed timeline: W3C ActivityPub recommendation in 2018, EU Data Act applicability in September 2025, first third-party WhatsApp interoperable services in November 2025, MCP as a founding Agentic AI Foundation project in December 2025, and EU identity wallets mandated for availability by the end of 2026.</desc>
<rect x="0" y="0" width="1000" height="685" fill="#f2f1ed"  />
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="800" fill="#11110f" >Openness is already being built</text><text x="48" y="100" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#5b5a56" >Selected standards and policy milestones • dates are not forecasts except as noted</text><line x1="145" y1="153" x2="145" y2="544" stroke="#dfded9" stroke-width="5"/><circle cx="145" cy="165" r="10" fill="#11110f"/><text x="50" y="171" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" text-anchor="start">2018</text><text x="190" y="165" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >ActivityPub</text><text x="190" y="194" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >W3C social-networking recommendation</text>
<circle cx="145" cy="256" r="10" fill="#2149d8"/><text x="50" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#2149d8" text-anchor="start">SEP 2025</text><text x="190" y="256" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >EU Data Act</text><text x="190" y="285" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Data-sharing and cloud-switching rules apply</text>
<circle cx="145" cy="347" r="10" fill="#ed1c24"/><text x="50" y="353" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#ed1c24" text-anchor="start">NOV 2025</text><text x="190" y="347" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >WhatsApp interoperability</text><text x="190" y="376" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >First connected third-party messaging services</text>
<circle cx="145" cy="438" r="10" fill="#2149d8"/><text x="50" y="444" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#2149d8" text-anchor="start">DEC 2025</text><text x="190" y="438" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >MCP / Agentic AI Foundation</text><text x="190" y="467" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Open tool protocol under Linux Foundation umbrella</text>
<circle cx="145" cy="529" r="10" fill="#11110f"/><text x="50" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#11110f" text-anchor="start">END 2026</text><text x="190" y="529" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#11110f" >EU digital identity wallets</text><text x="190" y="558" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#5b5a56" >Availability required; not universal adoption</text><line x1="48" y1="616" x2="952" y2="616" stroke="#11110f" stroke-width="2"/><text x="48" y="642" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#11110f" >Sources: W3C, EU Commission (DMA/Data Act/Wallet), Linux Foundation</text><text x="48" y="666" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b5a56" >Different mechanisms; none alone makes every app or platform interoperable.</text>
</svg>
