<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Agentic AI inside enterprise software</title><desc id="chart-desc">Two distinct Gartner indicators: agentic AI, below 1% in 2024 and 33% forecast for 2028; task-specific agents, below 5% in 2025 and up to 40% forecast for end-2026. Missing years are unavailable. Separate 2027 prediction: one-third of implementations combine agents with different skills.</desc>
